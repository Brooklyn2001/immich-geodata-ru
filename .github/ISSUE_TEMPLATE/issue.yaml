name: Сообщение о проблеме
description: Сообщить о проблеме, возникшей при использовании
body:
  #
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]  
        > Если проблема — неточное распознавание на границе, то из-за особенностей реализации обратного геокодирования Immich этот проект решить её не может. Вместо этого:
        >  - попробуйте версию данных full;
        >  - либо добавьте данные о нужной точке на [GeoNames](https://www.geonames.org/); после включения в базу они попадут в следующий релиз.
  - type: input
    id: version
    attributes:
      label: Версия используемых данных
      description: Укажите имя скачанного файла данных, например geodata_admin_2.zip
      placeholder: ex. geodata_full.zip
    validations:
      required: true
  - type: input
    id: release-data
    attributes:
      label: Дата релиза данных
      description: Укажите дату релиза скачанных данных (она указана в заголовке Release). Желательно сначала попробовать свежую версию.
      placeholder: ex. 2025-03-17
    validations:
      required: true
  - type: input
    id: immich-version
    attributes:
      label: Версия Immich
      description: Укажите используемую версию Immich. Если используется не официальный образ, укажите и его имя, например `imagegenius/immich`
      placeholder: ex. 1.129.0
    validations:
      required: true
  - type: checkboxes
    id: check
    attributes:
      label: Подтверждение, что данные применились
      description: Подтвердите через логи Immich, что данные успешно импортированы (кроме случаев, когда импорт не удался); иначе сначала проверьте конфигурацию.
      options:
        - label: Да, в логах Immich появилась запись вроде `10000 geodata imported`, данные успешно импортированы
        - label: Нет, при запуске Immich импорт завершился ошибкой
  - type: textarea
    id: what-happened
    attributes:
      label: Что случилось
    validations:
      required: true
